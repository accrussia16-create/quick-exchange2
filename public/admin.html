<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>
Quick Exchange Admin
</title>

<style>

:root{
--bg:#06111f;
--card:#0c1c2e;
--card2:#10263d;
--border:#19334d;
--text:#f1f7ff;
--muted:#8fa5ba;
--primary:#20c7d9;
--blue:#4b7cff;
--success:#32d69b;
--warning:#ffc857;
--danger:#ff637d;
}

*{
box-sizing:border-box;
}

body{
margin:0;
background:
radial-gradient(
circle at 85% 0%,
#12375a,
transparent 35%
),
#06111f;
color:var(--text);
font-family:
Inter,
system-ui,
sans-serif;
}

button,
input,
select,
textarea{
font:inherit;
}

button{
cursor:pointer;
}

.container{
max-width:1250px;
margin:auto;
padding:22px;
}

.card{
background:var(--card);
border:1px solid var(--border);
border-radius:20px;
padding:22px;
margin-bottom:18px;
}

.login{
max-width:430px;
margin:
12vh auto;
}

.logo{
font-weight:900;
}

.logo span{
color:var(--primary);
}

label{
display:block;
font-size:12px;
color:var(--muted);
margin:
13px 0 7px;
}

input,
select,
textarea{
width:100%;
padding:12px;
border-radius:11px;
border:1px solid var(--border);
background:#071521;
color:white;
outline:none;
}

textarea{
min-height:80px;
resize:vertical;
}

button{
border:0;
border-radius:11px;
padding:12px 15px;
background:
linear-gradient(
135deg,
var(--blue),
var(--primary)
);
color:white;
font-weight:800;
}

.login button{
width:100%;
margin-top:16px;
}

.message{
color:var(--muted);
margin-top:10px;
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:25px;
}

.stats{
display:grid;
grid-template-columns:
repeat(4,1fr);
gap:12px;
margin-bottom:18px;
}

.stat{
background:var(--card2);
border:1px solid var(--border);
border-radius:15px;
padding:18px;
}

.stat small{
display:block;
color:var(--muted);
margin-bottom:7px;
}

.stat strong{
font-size:28px;
}

.form-grid{
display:grid;
grid-template-columns:
repeat(2,1fr);
gap:12px;
}

.checks{
display:flex;
gap:20px;
flex-wrap:wrap;
margin-top:15px;
}

.checkbox{
display:flex;
align-items:center;
gap:8px;
color:var(--muted);
}

.checkbox input{
width:auto;
}

.upi{
background:#081724;
border:1px solid var(--border);
border-radius:15px;
padding:17px;
margin-top:10px;
}

.upi-top{
display:flex;
justify-content:space-between;
gap:15px;
flex-wrap:wrap;
}

.state{
font-size:12px;
font-weight:900;
text-transform:uppercase;
}

.active{
color:var(--success);
}

.scheduled{
color:var(--warning);
}

.expired,
.disabled,
.archived{
color:var(--danger);
}

.timer{
font-size:20px;
font-weight:900;
margin-top:8px;
}

.actions{
display:flex;
gap:8px;
flex-wrap:wrap;
margin-top:12px;
}

.actions button{
width:auto;
}

.danger{
background:#672334;
}

.table-wrap{
overflow-x:auto;
}

table{
width:100%;
border-collapse:collapse;
min-width:900px;
}

th,
td{
padding:12px;
border-bottom:1px solid var(--border);
text-align:left;
vertical-align:top;
}

th{
font-size:12px;
color:var(--muted);
}

.order-note{
min-width:180px;
}

@media(max-width:850px){

.stats{
grid-template-columns:
1fr 1fr;
}

.form-grid{
grid-template-columns:1fr;
}

}

@media(max-width:500px){

.stats{
grid-template-columns:1fr;
}

.top{
align-items:flex-start;
flex-direction:column;
gap:15px;
}

.container{
padding:15px;
}

}

</style>

</head>

<body>

<div class="container">

<div
id="login"
class="card login"
>

<h1>
Admin Login
</h1>

<p class="message">
Sign in to manage Quick Exchange.
</p>

<label>
Username
</label>

<input
id="username"
autocomplete="username"
/>

<label>
Password
</label>

<input
id="password"
type="password"
autocomplete="current-password"
/>

<div
id="loginMessage"
class="message"
></div>

<button id="loginButton">
Sign In
</button>

</div>


<div
id="dashboard"
hidden
>

<div class="top">

<div class="logo">
⚡ <span>
Quick Exchange Admin
</span>
</div>

<button id="logout">
Logout
</button>

</div>


<div
id="stats"
class="stats"
></div>


<div class="card">

<h2>
Exchange Settings
</h2>

<div class="form-grid">

<div>

<label>
Site Name
</label>

<input id="siteName">

</div>

<div>

<label>
Fee %
</label>

<input
id="fee"
type="number"
step="0.01"
>

</div>

<div>

<label>
Minimum Amount
</label>

<input
id="minAmount"
type="number"
>

</div>

<div>

<label>
Maximum Amount
</label>

<input
id="maxAmount"
type="number"
>

</div>

<div>

<label>
EasyPaisa Rate
</label>

<input
id="easyRate"
type="number"
step="0.000001"
>

</div>

<div>

<label>
JazzCash Rate
</label>

<input
id="jazzRate"
type="number"
step="0.000001"
>

</div>

<div>

<label>
USDT Rate
</label>

<input
id="usdtRate"
type="number"
step="0.000001"
>

</div>

<div>

<label>
WhatsApp
</label>

<input id="whatsapp">

</div>

<div>

<label>
Telegram
</label>

<input id="telegram">

</div>

</div>

<div class="checks">

<label class="checkbox">

<input
id="easyEnabled"
type="checkbox"
>

EasyPaisa Enabled

</label>

<label class="checkbox">

<input
id="jazzEnabled"
type="checkbox"
>

JazzCash Enabled

</label>

<label class="checkbox">

<input
id="usdtEnabled"
type="checkbox"
>

USDT Enabled

</label>

</div>

<button
id="saveSettings"
>
Save Settings
</button>

<div
id="settingsMessage"
class="message"
></div>

</div>


<div class="card">

<h2>
UPI Management
</h2>

<div class="form-grid">

<div>

<label>
UPI Name / Label
</label>

<input
id="upiName"
placeholder="Main UPI"
>

</div>

<div>

<label>
UPI URL
</label>

<input
id="upiUrl"
placeholder="https://example.com/payment"
>

</div>

<div>

<label>
Start Date & Time
</label>

<input
id="upiStart"
type="datetime-local"
>

</div>

<div>

<label>
Expiry Date & Time
</label>

<input
id="upiExpiry"
type="datetime-local"
>

</div>

</div>

<button
id="addUpi"
>
Add UPI
</button>

<div
id="upiMessage"
class="message"
></div>

<div id="upiList"></div>

</div>


<div class="card">

<h2>
Orders
</h2>

<div class="table-wrap">

<table>

<thead>

<tr>

<th>
Order
</th>

<th>
Amount
</th>

<th>
Receive
</th>

<th>
Reference
</th>

<th>
Status
</th>

<th>
Admin Note
</th>

</tr>

</thead>

<tbody
id="orders"
></tbody>

</table>

</div>

</div>

</div>

</div>


<script>

const $ =
id =>
document.getElementById(id);

let adminData = null;


/* =========================================================
   HELPERS
========================================================= */

function escapeHtml(value){

return String(value ?? "")
.replace(
/[&<>"']/g,
char => ({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[char])
);

}

async function api(
url,
options = {}
){

const response =
await fetch(
url,
{
...options,

headers:{
"Content-Type":
"application/json",

...(options.headers || {})
}
}
);

const data =
await response
.json()
.catch(
() => ({})
);

if(!response.ok){

throw new Error(
data.error ||
"Request failed."
);

}

return data;

}


/* =========================================================
   AUTH
========================================================= */

async function checkAuthentication(){

try{

const data =
await api(
"/api/admin/me"
);

if(
data.authenticated
){

showDashboard();

}else{

$("login")
.hidden = false;

}

}catch(error){

$("loginMessage")
.textContent =
error.message;

}

}

async function login(){

$("loginMessage")
.textContent = "";

try{

await api(
"/api/admin/login",
{
method:"POST",

body:
JSON.stringify({
username:
$("username").value,

password:
$("password").value
})
}
);

showDashboard();

}catch(error){

$("loginMessage")
.textContent =
error.message;

}

}

async function logout(){

await api(
"/api/admin/logout",
{
method:"POST"
}
);

location.reload();

}


/* =========================================================
   DASHBOARD
========================================================= */

async function showDashboard(){

$("login")
.hidden = true;

$("dashboard")
.hidden = false;

await loadDashboard();

}

async function loadDashboard(){

adminData =
await api(
"/api/admin/data"
);

renderSettings();

renderStats();

renderUpis();

renderOrders();

}


/* =========================================================
   SETTINGS
========================================================= */

function renderSettings(){

const settings =
adminData.settings;

$("siteName").value =
settings.siteName;

$("fee").value =
settings.feePercent;

$("minAmount").value =
settings.minAmount;

$("maxAmount").value =
settings.maxAmount;

$("easyRate").value =
settings.rates.easypaisa;

$("jazzRate").value =
settings.rates.jazzcash;

$("usdtRate").value =
settings.rates.usdt;

$("whatsapp").value =
settings.contact.whatsapp || "";

$("telegram").value =
settings.contact.telegram || "";

$("easyEnabled").checked =
settings.methods.easypaisa;

$("jazzEnabled").checked =
settings.methods.jazzcash;

$("usdtEnabled").checked =
settings.methods.usdt;

}

async function saveSettings(){

$("settingsMessage")
.textContent = "";

try{

await api(
"/api/admin/settings",
{
method:"PUT",

body:
JSON.stringify({

siteName:
$("siteName").value,

feePercent:
Number(
$("fee").value
),

minAmount:
Number(
$("minAmount").value
),

maxAmount:
Number(
$("maxAmount").value
),

rates:{
easypaisa:
Number(
$("easyRate").value
),

jazzcash:
Number(
$("jazzRate").value
),

usdt:
Number(
$("usdtRate").value
)
},

methods:{
easypaisa:
$("easyEnabled")
.checked,

jazzcash:
$("jazzEnabled")
.checked,

usdt:
$("usdtEnabled")
.checked
},

contact:{
whatsapp:
$("whatsapp").value,

telegram:
$("telegram").value
}

})
}
);

$("settingsMessage")
.textContent =
"Settings saved.";

await loadDashboard();

}catch(error){

$("settingsMessage")
.textContent =
error.message;

}

}


/* =========================================================
   STATS
========================================================= */

function renderStats(){

const orders =
adminData.orders;

const upis =
adminData.upiLinks;

const pending =
orders.filter(
o =>
o.status ===
"pending"
).length;

const processing =
orders.filter(
o =>
o.status ===
"processing"
).length;

const activeUpi =
upis.filter(
u =>
u.state ===
"active"
).length;

$("stats").innerHTML = `

<div class="stat">

<small>
Total Orders
</small>

<strong>
${orders.length}
</strong>

</div>

<div class="stat">

<small>
Pending
</small>

<strong>
${pending}
</strong>

</div>

<div class="stat">

<small>
Processing
</small>

<strong>
${processing}
</strong>

</div>

<div class="stat">

<small>
Active UPI
</small>

<strong>
${activeUpi}
</strong>

</div>

`;

}


/* =========================================================
   UPI
========================================================= */

function renderUpis(){

const container =
$("upiList");

if(
adminData.upiLinks.length ===
0
){

container.innerHTML = `
<p class="message">
No UPI entries yet.
</p>
`;

return;

}

container.innerHTML =
adminData.upiLinks
.map(
upi => `

<div class="upi">

<div class="upi-top">

<div>

<strong>
${escapeHtml(
upi.name
)}
</strong>

<div
class="state ${escapeHtml(
upi.state
)}"
>
${escapeHtml(
upi.state
)}
</div>

</div>

${
upi.expiresAt &&
upi.state ===
"active"
?
`
<div
class="timer"
id="upi-timer-${escapeHtml(
upi.id
)}"
>
—
</div>
`
:
""
}

</div>

<p class="message">

URL:
${escapeHtml(
upi.url
)}

<br>

Starts:
${new Date(
upi.startAt
).toLocaleString()}

<br>

Expires:
${
upi.expiresAt
?
new Date(
upi.expiresAt
).toLocaleString()
:
"No expiry"
}

</p>

<div class="actions">

<button
onclick="toggleUpi(
'${escapeHtml(
upi.id
)}',
${upi.enabled !== true}
)"
>
${
upi.enabled === true
? "Disable"
: "Enable"
}
</button>

<button
class="danger"
onclick="archiveUpi(
'${escapeHtml(
upi.id
)}'
)"
>
Archive
</button>

</div>

</div>

`
)
.join("");

adminData.upiLinks
.filter(
upi =>
upi.expiresAt &&
upi.state ===
"active"
)
.forEach(
upi =>
startUpiCountdown(
upi.id,
upi.expiresAt
)
);

}

function startUpiCountdown(
id,
expiresAt
){

const element =
$(
"upi-timer-" +
id
);

if(!element){
return;
}

const update = () => {

const remaining =
new Date(
expiresAt
).getTime() -
Date.now();

if(
remaining <= 0
){

element.textContent =
"Expired";

setTimeout(
loadDashboard,
500
);

return;

}

let seconds =
Math.floor(
remaining / 1000
);

let minutes =
Math.floor(
seconds / 60
);

let hours =
Math.floor(
minutes / 60
);

seconds %= 60;

minutes %= 60;

if(hours){

element.textContent =
`${hours}h ${minutes}m ${String(seconds).padStart(2,"0")}s`;

}else{

element.textContent =
`${String(minutes).padStart(2,"0")}:${String(seconds).padStart(2,"0")}`;

}

};

update();

setInterval(
update,
1000
);

}

function datetimeToIso(
elementId
){

const value =
$(elementId).value;

if(!value){
return null;
}

const date =
new Date(value);

if(
Number.isNaN(
date.getTime()
)
){

return null;

}

return date.toISOString();

}

async function addUpi(){

$("upiMessage")
.textContent = "";

const startAt =
datetimeToIso(
"upiStart"
);

const expiresAt =
datetimeToIso(
"upiExpiry"
);

try{

await api(
"/api/admin/upi",
{
method:"POST",

body:
JSON.stringify({

name:
$("upiName").value,

url:
$("upiUrl").value,

startAt,

expiresAt

})
}
);

$("upiMessage")
.textContent =
"UPI created.";

$("upiName").value = "";
$("upiUrl").value = "";
$("upiStart").value = "";
$("upiExpiry").value = "";

await loadDashboard();

}catch(error){

$("upiMessage")
.textContent =
error.message;

}

}

async function toggleUpi(
id,
enabled
){

try{

await api(
"/api/admin/upi/" +
encodeURIComponent(id),
{
method:"PUT",

body:
JSON.stringify({
enabled
})
}
);

await loadDashboard();

}catch(error){

alert(
error.message
);

}

}

async function archiveUpi(
id
){

if(
!confirm(
"Archive this UPI?"
)
){

return;

}

try{

await api(
"/api/admin/upi/" +
encodeURIComponent(id),
{
method:"DELETE"
}
);

await loadDashboard();

}catch(error){

alert(
error.message
);

}

}


/* =========================================================
   ORDERS
========================================================= */

function renderOrders(){

const container =
$("orders");

if(
adminData.orders.length ===
0
){

container.innerHTML = `

<tr>

<td
colspan="6"
class="message"
>
No orders yet.
</td>

</tr>

`;

return;

}

container.innerHTML =
adminData.orders
.map(
order => `

<tr>

<td>

<strong>
${escapeHtml(
order.id
)}
</strong>

<br>

<small>
${new Date(
order.createdAt
).toLocaleString()}
</small>

</td>


<td>

${escapeHtml(
order.amount
)}

</td>


<td>

${escapeHtml(
order.receiveMethod
)}

<br>

${escapeHtml(
order.receiveAmount
)}

<br>

<small>

${
order.receiveMethod ===
"usdt"

?
escapeHtml(
order.receiver
?.wallet
)
+
"<br>"
+
escapeHtml(
order.receiver
?.network
)

:

escapeHtml(
order.receiver
?.name
)
+
"<br>"
+
escapeHtml(
order.receiver
?.number
)

}

</small>

</td>


<td>

${escapeHtml(
order.paymentReference ||
"—"
)}

</td>


<td>

<select
onchange="updateOrderStatus(
'${escapeHtml(
order.id
)}',
this.value
)"
>

${
[
"pending",
"processing",
"completed",
"rejected"
]
.map(
status => `
<option
value="${status}"
${
order.status ===
status
?
"selected"
:
""
}
>
${status}
</option>
`
)
.join("")
}

</select>

</td>


<td>

<textarea
id="note-${escapeHtml(
order.id
)}"
class="order-note"
>${escapeHtml(
order.adminNote ||
""
)}</textarea>

<button
style="margin-top:7px"
onclick="saveOrderNote(
'${escapeHtml(
order.id
)}'
)"
>
Save Note
</button>

</td>

</tr>

`
)
.join("");

}

async function updateOrderStatus(
id,
status
){

try{

await api(
"/api/admin/orders/" +
encodeURIComponent(id),
{
method:"PUT",

body:
JSON.stringify({
status
})
}
);

await loadDashboard();

}catch(error){

alert(
error.message
);

}

}

async function saveOrderNote(
id
){

try{

await api(
"/api/admin/orders/" +
encodeURIComponent(id),
{
method:"PUT",

body:
JSON.stringify({

adminNote:
$(
"note-" +
id
).value

})
}
);

await loadDashboard();

}catch(error){

alert(
error.message
);

}

}


/* =========================================================
   EVENTS
========================================================= */

$("loginButton")
.addEventListener(
"click",
login
);

$("password")
.addEventListener(
"keydown",
event => {

if(
event.key ===
"Enter"
){

login();

}

}
);

$("logout")
.addEventListener(
"click",
logout
);

$("saveSettings")
.addEventListener(
"click",
saveSettings
);

$("addUpi")
.addEventListener(
"click",
addUpi
);


/* =========================================================
   START
========================================================= */

checkAuthentication();

</script>

</body>

</html>
