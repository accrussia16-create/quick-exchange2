<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Order — Quick Exchange</title>

<style>

:root{
--bg:#06111f;
--card:#0c1c2e;
--border:#19334d;
--text:#f1f7ff;
--muted:#8fa5ba;
--primary:#20c7d9;
--blue:#4b7cff;
--success:#32d69b;
--danger:#ff637d;
}

*{
box-sizing:border-box;
}

body{
margin:0;
background:
radial-gradient(
circle at 85% 0%,
#12375a,
transparent 35%
),
#06111f;
color:var(--text);
font-family:
Inter,
system-ui,
sans-serif;
}

a{
color:var(--muted);
text-decoration:none;
}

.container{
max-width:900px;
margin:auto;
padding:25px;
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:30px;
}

.logo{
font-weight:900;
color:white;
}

.logo span{
color:var(--primary);
}

.card{
background:var(--card);
border:1px solid var(--border);
border-radius:22px;
padding:25px;
margin-bottom:18px;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

.item{
background:#081724;
border:1px solid var(--border);
padding:15px;
border-radius:13px;
}

.item small{
display:block;
color:var(--muted);
margin-bottom:6px;
}

label{
display:block;
font-size:13px;
color:var(--muted);
margin:
17px 0 8px;
}

input{
width:100%;
padding:14px;
background:#071521;
border:1px solid var(--border);
border-radius:12px;
color:white;
font:inherit;
}

button{
border:0;
border-radius:12px;
padding:13px 17px;
background:
linear-gradient(
135deg,
var(--blue),
var(--primary)
);
color:white;
font-weight:800;
cursor:pointer;
}

.upi{
display:flex;
justify-content:space-between;
align-items:center;
gap:15px;
padding:17px;
border:1px solid var(--border);
background:#081724;
border-radius:15px;
margin-top:10px;
}

.timer{
color:var(--success);
font-weight:800;
margin-top:7px;
}

.message{
color:var(--danger);
margin-top:12px;
}

.status{
display:inline-block;
padding:7px 11px;
border-radius:999px;
background:#14283d;
text-transform:capitalize;
}

.links{
display:flex;
gap:18px;
flex-wrap:wrap;
margin-top:22px;
}

@media(max-width:650px){

.grid{
grid-template-columns:1fr;
}

.upi{
flex-direction:column;
align-items:flex-start;
}

.upi button{
width:100%;
}

}

</style>

</head>

<body>

<div class="container">

<div class="top">

<a
href="/"
class="logo"
>
⚡ <span>Quick Exchange</span>
</a>

<a href="/status">
Track Order
</a>

</div>

<div id="app">
Loading order...
</div>

</div>

<script>

const orderId =
new URLSearchParams(
location.search
).get("id");

const $ =
id =>
document.getElementById(id);

let order = null;
let config = null;

function escapeHtml(value){

return String(value ?? "")
.replace(
/[&<>"']/g,
char => ({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[char])
);

}

function formatNumber(value){

return Number(value)
.toLocaleString(
undefined,
{
maximumFractionDigits:8
}
);

}

async function loadData(){

const [
orderResponse,
publicResponse
] =
await Promise.all([
fetch(
"/api/orders/" +
encodeURIComponent(
orderId
)
),

fetch(
"/api/public"
)
]);

const orderData =
await orderResponse.json();

const publicData =
await publicResponse.json();

if(!orderResponse.ok){

throw new Error(
orderData.error
);

}

order =
orderData.order;

config =
publicData;

render();

}

function render(){

$("app").innerHTML = `

<div class="card">

<h1>
Complete your order
</h1>

<p style="color:var(--muted)">
Order ID:
<strong>
${escapeHtml(order.id)}
</strong>
</p>

<div class="grid">

<div class="item">
<small>You Send</small>
<strong>
${formatNumber(order.amount)}
</strong>
</div>

<div class="item">
<small>You Receive</small>
<strong>
${formatNumber(order.receiveAmount)}
</strong>
</div>

<div class="item">
<small>Locked Rate</small>
<strong>
${formatNumber(order.lockedRate)}
</strong>
</div>

<div class="item">
<small>Status</small>
<span class="status">
${escapeHtml(order.status)}
</span>
</div>

</div>

</div>


<div class="card">

<h2>
1. Pay using an active UPI
</h2>

<p style="color:var(--muted)">
Select an active payment option.
The server verifies that the UPI is still active.
</p>

<div id="upis"></div>

</div>


<div class="card">

<h2>
2. Submit payment reference
</h2>

<label>
Transaction / Payment Reference
</label>

<input
id="reference"
value="${escapeHtml(
order.paymentReference || ""
)}"
placeholder="Enter your payment reference"
/>

<div
id="message"
class="message"
></div>

<button id="submitReference">
Submit Reference
</button>

<div class="links">

<a
href="/status?id=${encodeURIComponent(
order.id
)}"
>
View Order Status →
</a>

<a href="/">
Back to Exchange
</a>

</div>

</div>

`;

renderUpis();

$("submitReference")
.addEventListener(
"click",
submitReference
);

}

function renderUpis(){

const container =
$("upis");

if(
!config.upiLinks ||
config.upiLinks.length === 0
){

container.innerHTML = `
<p style="color:var(--muted)">
No active UPI payment option is available.
Please check again shortly.
</p>
`;

return;

}

container.innerHTML =
config.upiLinks
.map(
upi => `

<div class="upi">

<div>

<strong>
${escapeHtml(
upi.name
)}
</strong>

<div
class="timer"
id="timer-${escapeHtml(
upi.id
)}"
>

${
upi.expiresAt
? "Loading..."
: "Active — No expiry"
}

</div>

</div>

<button
data-upi="${escapeHtml(
upi.id
)}"
>
Pay with UPI
</button>

</div>

`
)
.join("");

config.upiLinks
.forEach(
upi => {

if(upi.expiresAt){

startCountdown(
upi.id,
upi.expiresAt
);

}

}
);

container
.querySelectorAll(
"[data-upi]"
)
.forEach(
button => {

button.addEventListener(
"click",
() => {

selectUpi(
button.dataset.upi
);

}
);

}
);

}

function startCountdown(
upiId,
expiresAt
){

const element =
$(
"timer-" +
upiId
);

const update = () => {

const remaining =
new Date(
expiresAt
).getTime() -
Date.now();

if(
remaining <= 0
){

element.textContent =
"Expired";

setTimeout(
loadData,
500
);

return;

}

let seconds =
Math.floor(
remaining / 1000
);

let minutes =
Math.floor(
seconds / 60
);

let hours =
Math.floor(
minutes / 60
);

seconds %= 60;

minutes %= 60;

if(hours){

element.textContent =
`${hours}h ${minutes}m ${String(seconds).padStart(2,"0")}s`;

}else{

element.textContent =
`${String(minutes).padStart(2,"0")}:${String(seconds).padStart(2,"0")}`;

}

};

update();

setInterval(
update,
1000
);

}

async function selectUpi(
upiId
){

$("message")
.textContent = "";

try{

const response =
await fetch(
"/api/orders/" +
encodeURIComponent(
order.id
) +
"/select-upi",
{
method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:
JSON.stringify({
upiId
})
}
);

const data =
await response.json();

if(!response.ok){

throw new Error(
data.error
);

}

window.location.href =
data.url;

}catch(error){

$("message")
.textContent =
error.message;

await loadData();

}

}

async function submitReference(){

const reference =
$("reference")
.value
.trim();

$("message")
.textContent = "";

if(!reference){

$("message")
.textContent =
"Payment reference is required.";

return;

}

try{

const response =
await fetch(
"/api/orders/" +
encodeURIComponent(
order.id
),
{
method:"PUT",

headers:{
"Content-Type":
"application/json"
},

body:
JSON.stringify({
paymentReference:
reference
})
}
);

const data =
await response.json();

if(!response.ok){

throw new Error(
data.error
);

}

window.location.href =
"/status?id=" +
encodeURIComponent(
order.id
);

}catch(error){

$("message")
.textContent =
error.message;

}

}

if(!orderId){

$("app").textContent =
"Missing order ID.";

}else{

loadData()
.catch(
error => {
$("app").textContent =
error.message;
}
);

}

</script>

</body>

</html>
