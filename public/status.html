<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>
Order Status — Quick Exchange
</title>

<style>

:root{
--bg:#06111f;
--card:#0c1c2e;
--border:#19334d;
--text:#f1f7ff;
--muted:#8fa5ba;
--primary:#20c7d9;
--danger:#ff637d;
}

*{
box-sizing:border-box;
}

body{
margin:0;
background:
radial-gradient(
circle at 85% 0%,
#12375a,
transparent 35%
),
#06111f;
color:var(--text);
font-family:
Inter,
system-ui,
sans-serif;
}

a{
color:var(--muted);
text-decoration:none;
}

.container{
max-width:760px;
margin:auto;
padding:30px 20px;
}

.logo{
font-weight:900;
color:white;
}

.logo span{
color:var(--primary);
}

.card{
margin-top:35px;
background:var(--card);
border:1px solid var(--border);
border-radius:22px;
padding:27px;
}

.row{
display:flex;
justify-content:space-between;
gap:20px;
padding:15px 0;
border-bottom:1px solid var(--border);
}

.row:last-child{
border-bottom:0;
}

.muted{
color:var(--muted);
}

.status{
padding:8px 12px;
border-radius:999px;
background:#14283d;
text-transform:capitalize;
}

.links{
display:flex;
gap:20px;
flex-wrap:wrap;
margin-top:25px;
}

.error{
color:var(--danger);
}

@media(max-width:550px){

.row{
flex-direction:column;
gap:5px;
}

}

</style>

</head>

<body>

<div class="container">

<a
href="/"
class="logo"
>
⚡ <span>Quick Exchange</span>
</a>

<div
id="app"
class="card"
>
Loading...
</div>

</div>

<script>

const orderId =
new URLSearchParams(
location.search
).get("id");

const $ =
id =>
document.getElementById(id);

function escapeHtml(value){

return String(value ?? "")
.replace(
/[&<>"']/g,
char => ({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[char])
);

}

function formatNumber(value){

return Number(value)
.toLocaleString(
undefined,
{
maximumFractionDigits:8
}
);

}

async function loadOrder(){

if(!orderId){

throw new Error(
"Missing order ID."
);

}

const response =
await fetch(
"/api/orders/" +
encodeURIComponent(
orderId
)
);

const data =
await response.json();

if(!response.ok){

throw new Error(
data.error
);

}

const order =
data.order;

$("app").innerHTML = `

<h1>
Order Status
</h1>

<p class="muted">
Your current order information.
</p>

<div class="row">

<span class="muted">
Order ID
</span>

<strong>
${escapeHtml(
order.id
)}
</strong>

</div>

<div class="row">

<span class="muted">
Created
</span>

<span>
${new Date(
order.createdAt
).toLocaleString()}
</span>

</div>

<div class="row">

<span class="muted">
Send Amount
</span>

<strong>
${formatNumber(
order.amount
)}
</strong>

</div>

<div class="row">

<span class="muted">
Receive Method
</span>

<span>
${escapeHtml(
order.receiveMethod
)}
</span>

</div>

<div class="row">

<span class="muted">
Locked Rate
</span>

<span>
${formatNumber(
order.lockedRate
)}
</span>

</div>

<div class="row">

<span class="muted">
Receive Amount
</span>

<strong>
${formatNumber(
order.receiveAmount
)}
</strong>

</div>

<div class="row">

<span class="muted">
Payment Reference
</span>

<span>
${
order.paymentReference
?
escapeHtml(
order.paymentReference
)
:
"Not submitted"
}
</span>

</div>

<div class="row">

<span class="muted">
Current Status
</span>

<span class="status">
${escapeHtml(
order.status
)}
</span>

</div>

${
order.adminNote
?
`
<div class="row">

<span class="muted">
Admin Update
</span>

<span>
${escapeHtml(
order.adminNote
)}
</span>

</div>
`
:
""
}

<div class="links">

<a
href="/order?id=${encodeURIComponent(
order.id
)}"
>
Open Order
</a>

<a href="/">
Back to Exchange
</a>

</div>

`;

}

loadOrder()
.catch(
error => {

$("app").innerHTML = `

<h2 class="error">
${escapeHtml(
error.message
)}
</h2>

<div class="links">

<a href="/">
Back to Exchange
</a>

</div>

`;

}
);

</script>

</body>

</html>
